<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Models | Ehsan Najafi</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
    background: #fff;
    color: #1a1a1a;
    font-weight: 300;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    background: #fff;
    padding: 15px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ebebeb;
  }
  .bmw-logo {
    width: 45px; height: 45px; border-radius: 50%;
    background: conic-gradient(#0066b1 0deg 90deg, #fff 90deg 180deg, #0066b1 180deg 270deg, #fff 270deg 360deg);
    border: 3px solid #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: bold; color: #000;
  }
  .center-text {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #666;
    font-weight: 400;
  }
  .center-text .pin {
    color: #0066b1;
    font-size: 16px;
  }
  .close-btn {
    font-size: 24px;
    color: #999;
    cursor: pointer;
    background: none;
    border: none;
    font-weight: 300;
    line-height: 1;
  }

  /* ===== PAGE HEADER ===== */
  .page-header {
    background: #fff;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid #ebebeb;
  }
  .back-arrow {
    font-size: 24px;
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 300;
    margin-right: 30px;
  }
  .page-header h1 {
    flex: 1;
    text-align: center;
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 1px;
    color: #1a1a1a;
    margin-right: 30px;
  }

  /* ===== MENU LIST ===== */
  .menu-list {
    padding: 30px 30px 40px;
  }
  .menu-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 22px 0;
    border-bottom: 1px solid #f0f0f0;
    text-decoration: none;
    color: #1a1a1a;
    font-size: 18px;
    font-weight: 400;
    transition: color 0.3s;
  }
  .menu-item:hover { color: #0066b1; }
  .menu-item .arrow {
    color: #999;
    font-size: 18px;
    font-weight: 300;
  }
  .menu-item .m-badge {
    display: inline-block;
    margin-left: 8px;
    vertical-align: middle;
  }

  .divider {
    height: 1px;
    background: #d0d0d0;
    margin: 35px 0;
  }

  /* BMW M colors badge */
  .m-stripes {
    display: inline-flex;
    align-items: center;
    margin-left: 8px;
    vertical-align: middle;
  }
  .m-stripes span {
    display: inline-block;
    width: 5px;
    height: 14px;
  }
  .m-stripes .blue { background: #0066b1; }
  .m-stripes .darkblue { background: #003d7a; }
  .m-stripes .red { background: #e7222e; }
  .m-stripes .lightblue { background: #66b8e0; }

  .alpina-arrow {
    color: #999;
    margin-left: 10px;
  }

  /* ===== BOTTOM SEARCH ===== */
  .bottom-search {
    padding: 40px 30px 60px;
    display: flex;
    justify-content: center;
  }
  .search-box {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1.5px solid #1a1a1a;
    padding: 14px 22px;
    width: 100%;
    max-width: 400px;
    background: #fff;
  }
  .search-box .search-icon {
    font-size: 18px;
    color: #1a1a1a;
  }
  .search-box input {
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    font-weight: 300;
    color: #1a1a1a;
    flex: 1;
    background: transparent;
  }
  .search-box input::placeholder {
    color: #999;
  }

  /* ===== CTA IMAGE ===== */
  .cta-image {
    position: relative;
    height: 320px;
    background: linear-gradient(180deg, #2a2a2a 0%, #000 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    margin: 0;
  }
  .cta-image::before {
    content: '';
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    width: 70%;
    height: 40%;
    background: radial-gradient(ellipse, rgba(231,34,46,0.6) 0%, transparent 70%);
    border-radius: 50%;
    filter: blur(40px);
  }
  .cta-image .car-silhouette {
    font-size: 0;
    position: relative;
    bottom: 30px;
    z-index: 2;
  }
  .cta-image .car-silhouette::before {
    content: '🚗';
    font-size: 90px;
    filter: grayscale(100%) brightness(0.5) drop-shadow(0 0 30px rgba(231,34,46,0.8));
  }

  /* ===== FOOTER ===== */
  footer {
    background: #1a1a1a;
    color: #666;
    text-align: center;
    padding: 30px 20px;
    font-size: 12px;
    letter-spacing: 1px;
  }

  @media (max-width: 700px) {
    .top-bar { padding: 12px 18px; }
    .center-text { font-size: 12px; }
    .bmw-logo { width: 38px; height: 38px; font-size: 9px; }
    .menu-list { padding: 20px 22px 30px; }
    .menu-item { font-size: 16px; padding: 20px 0; }
    .bottom-search { padding: 30px 22px 50px; }
    .cta-image { height: 220px; }
  }
</style>
</head>
<body>

  <!-- TOP BAR (Choose your center) -->
  <div class="top-bar">
    <div class="bmw-logo">BMW</div>
    <div class="center-text">
      <span class="pin">📍</span>
      Choose your local BMW Center
    </div>
    <button class="close-btn" onclick="window.location.href='index.html'">×</button>
  </div>

  <!-- PAGE HEADER -->
  <div class="page-header">
    <a href="index.html" class="back-arrow">‹</a>
    <h1>Models</h1>
  </div>

  <!-- MENU LIST -->
  <div class="menu-list">

    <a href="#" class="menu-item">
      <span>All Models</span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>SUVs</span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>Sedans</span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>Coupes</span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>Convertibles</span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>Touring</span>
      <span class="arrow">›</span>
    </a>

    <div class="divider"></div>

    <a href="#" class="menu-item">
      <span>Electrified
        <svg width="14" height="14" viewBox="0 0 14 14" style="vertical-align: middle; margin-left: 8px;">
          <path d="M7 0 L3 7 L6 7 L5 14 L11 6 L8 6 L9 0 Z" fill="#0066b1"/>
        </svg>
      </span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>BMW M
        <span class="m-stripes">
          <span class="lightblue"></span>
          <span class="darkblue"></span>
          <span class="red"></span>
        </span>
      </span>
      <span class="arrow">›</span>
    </a>

    <a href="#" class="menu-item">
      <span>BMW ALPINA <span class="alpina-arrow">›</span></span>
    </a>

  </div>

  <!-- SEARCH -->
  <div class="bottom-search">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search">
    </div>
  </div>

  <!-- CTA IMAGE -->
  <div class="cta-image">
    <div class="car-silhouette"></div>
  </div>

  <footer>
    © 2026 Ehsan Najafi | All Rights Reserved
  </footer>

</body>
</html>
